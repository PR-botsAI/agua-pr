services:
  api:
    image: ghcr.io/pr-botsai/agua-pr-api:${H2OPR_IMAGE_TAG:-v2-edge}
    container_name: h2opr-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      PREPA_CACHE_MS: 15000
      RESOURCE_CACHE_MS: 30000
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(d=>{if(d.status==='unavailable')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

