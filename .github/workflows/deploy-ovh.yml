name: Deploy H2O PR API to OVH VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container tag to deploy"
        required: false
        default: "v2-edge"

permissions:
  contents: read

concurrency:
  group: h2opr-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/h2opr_ovh
          chmod 600 ~/.ssh/h2opr_ovh
          PORT="${OVH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Verify remote prerequisites
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
            'docker --version && docker compose version && mkdir -p ~/h2opr && docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"'

      - name: Copy H2O production configuration
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          scp -i ~/.ssh/h2opr_ovh -P "$PORT" \
            deploy/ovh/compose.yaml deploy/ovh/azuracast-h2opr.conf \
            "$OVH_USER@$OVH_HOST:~/h2opr/"

      - name: Deploy H2O API container
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
              "docker login ghcr.io -u '${GHCR_USER:-PR-botsAI}' --password-stdin"
          fi
          ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
            "cd ~/h2opr && H2OPR_IMAGE_TAG='${IMAGE_TAG:-v2-edge}' docker compose pull && H2OPR_IMAGE_TAG='${IMAGE_TAG:-v2-edge}' docker compose up -d --remove-orphans && docker compose ps"

      - name: Attach H2O to AzuraCast and reload NGINX
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          AZ_CONTAINER=""
          for id in $(docker ps -q); do
            image=$(docker inspect -f '{{.Config.Image}}' "$id" 2>/dev/null || true)
            ports=$(docker port "$id" 2>/dev/null || true)
            if printf '%s' "$image" | grep -qi 'azuracast' && printf '%s' "$ports" | grep -Eq '(^|[[:space:]])80/tcp|(^|[[:space:]])443/tcp'; then
              AZ_CONTAINER="$id"
              break
            fi
          done

          if [ -z "$AZ_CONTAINER" ]; then
            echo "Could not identify the running AzuraCast web container."
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Ports}}'
            exit 1
          fi

          echo "AzuraCast container: $(docker inspect -f '{{.Name}}' "$AZ_CONTAINER")"

          networks=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$AZ_CONTAINER")
          AZ_NET=$(printf '%s\n' "$networks" | tr ' ' '\n' | grep -E 'azuracast|default' | head -n1 || true)
          if [ -z "$AZ_NET" ]; then
            AZ_NET=$(printf '%s\n' "$networks" | awk '{print $1}')
          fi
          test -n "$AZ_NET"
          echo "AzuraCast network: $AZ_NET"

          if ! docker inspect -f '{{json .NetworkSettings.Networks}}' h2opr-api | grep -q "\"$AZ_NET\""; then
            docker network connect "$AZ_NET" h2opr-api
          fi

          docker exec "$AZ_CONTAINER" mkdir -p /etc/nginx/azuracast.conf.d
          docker cp "$HOME/h2opr/azuracast-h2opr.conf" "$AZ_CONTAINER:/etc/nginx/azuracast.conf.d/h2opr.conf"

          docker exec "$AZ_CONTAINER" nginx -t
          docker exec "$AZ_CONTAINER" nginx -s reload

          echo "Testing H2O directly on shared Docker network..."
          docker run --rm --network "$AZ_NET" curlimages/curl:8.11.1 \
            --fail --silent --show-error http://h2opr-api:8080/api/v1/health
          echo

          echo "Testing routing through existing AzuraCast NGINX..."
          curl --fail --silent --show-error -H 'Host: api.h20pr.com' \
            http://127.0.0.1/api/v1/health
          echo
          REMOTE

      - name: Report external HTTP status
        run: |
          set -euo pipefail
          if getent ahostsv4 api.h20pr.com >/dev/null 2>&1; then
            echo "api.h20pr.com resolves; checking HTTP routing"
            curl --fail --silent --show-error --max-time 15 \
              http://api.h20pr.com/api/v1/health || {
                echo "External HTTP check is not healthy yet. DNS/proxy propagation may still be pending."
                exit 1
              }
            echo
          else
            echo "api.h20pr.com does not resolve yet. Add its A record before public cutover."
          fi
