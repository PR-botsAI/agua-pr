name: Deploy H2O PR API to OVH VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container tag to deploy"
        required: false
        default: "v2-edge"

permissions:
  contents: read

concurrency:
  group: h2opr-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/h2opr_ovh
          chmod 600 ~/.ssh/h2opr_ovh
          PORT="${OVH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Verify remote prerequisites
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
            'docker --version && docker compose version && mkdir -p ~/h2opr && docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"'

      - name: Copy H2O configuration
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          scp -i ~/.ssh/h2opr_ovh -P "$PORT" deploy/ovh/compose.yaml "$OVH_USER@$OVH_HOST:~/h2opr/"

      - name: Deploy isolated H2O API container
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
              "docker login ghcr.io -u '${GHCR_USER:-PR-botsAI}' --password-stdin"
          fi
          ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
            "cd ~/h2opr && H2OPR_IMAGE_TAG='${IMAGE_TAG:-v2-edge}' docker compose pull && H2OPR_IMAGE_TAG='${IMAGE_TAG:-v2-edge}' docker compose up -d --remove-orphans && docker compose ps"

      - name: Verify API on VPS
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          ssh -i ~/.ssh/h2opr_ovh -p "$PORT" "$OVH_USER@$OVH_HOST" \
            'for i in $(seq 1 12); do curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health && exit 0; sleep 5; done; docker logs --tail 100 h2opr-api; exit 1'

      - name: Verify public staging endpoint
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "http://${OVH_HOST}:18080/api/v1/health"; then
              echo
              echo "Public H2O staging API is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Public staging endpoint did not become healthy"
          exit 1
