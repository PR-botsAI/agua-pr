name: Test H2O PR V2 backend

on:
  push:
    branches: ["h2opr-v2-backend"]
    paths:
      - "v2/**"
      - "data/resources.json"
      - ".github/workflows/v2-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe current PREPA feeds
        working-directory: v2
        run: npm run probe
      - name: Start H2O PR API
        working-directory: v2
        run: |
          node server/index.mjs > /tmp/h2opr-v2.log 2>&1 &
          echo $! > /tmp/h2opr-v2.pid
          sleep 2
      - name: Verify live data and emergency APIs
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/prepa/levels | tee /tmp/levels.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/municipalities | tee /tmp/towns.json
          curl --fail --silent 'http://127.0.0.1:8080/api/v1/resources/water?municipality=Carolina' | tee /tmp/water.json
          curl --fail --silent 'http://127.0.0.1:8080/api/v1/resources/help?municipality=Arecibo' | tee /tmp/help.json
          curl --fail --silent 'http://127.0.0.1:8080/api/v1/rationing?municipality=San%20Juan&sector=Condado' | tee /tmp/rationing.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const health=read('/tmp/health.json');
          const levels=read('/tmp/levels.json');
          const towns=read('/tmp/towns.json');
          const water=read('/tmp/water.json');
          const help=read('/tmp/help.json');
          const rationing=read('/tmp/rationing.json');
          if(!['healthy','degraded'].includes(health.status)) process.exit(2);
          if(levels.status==='live' && !levels.reservoirs?.length) process.exit(3);
          if(!Array.isArray(towns.municipalities) || towns.municipalities.length < 70) process.exit(4);
          if(water.municipality!=='Carolina' || !Array.isArray(water.waterPoints)) process.exit(5);
          if(help.municipality!=='Arecibo' || !help.aaa?.phone) process.exit(6);
          if(rationing.municipality!=='San Juan' || rationing.affected!==true) process.exit(7);
          console.log({health:health.status,reservoirs:levels.reservoirs?.length||0,municipalities:towns.municipalities.length,carolinaWaterPoints:water.waterPoints.length,rationingMatch:rationing.matched??null});
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/h2opr-v2.log || true
