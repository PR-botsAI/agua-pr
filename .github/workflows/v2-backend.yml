name: Test H2O PR V2 backend

on:
  push:
    branches: ["h2opr-v2-backend"]
    paths:
      - "v2/**"
      - ".github/workflows/v2-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe current PREPA feeds
        working-directory: v2
        run: npm run probe
      - name: Start H2O PR API
        working-directory: v2
        run: |
          node server/index.mjs > /tmp/h2opr-v2.log 2>&1 &
          echo $! > /tmp/h2opr-v2.pid
          sleep 2
      - name: Verify health and normalized API
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/prepa/levels | tee /tmp/levels.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const levels=JSON.parse(fs.readFileSync('/tmp/levels.json','utf8'));
          if(!['healthy','degraded'].includes(health.status)) process.exit(2);
          if(levels.status==='live' && !levels.reservoirs?.length) process.exit(3);
          console.log({health:health.status,reservoirs:levels.reservoirs?.length||0});
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/h2opr-v2.log || true
