name: Refresh official H2O PR data

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: ["main"]
    paths:
      - "scripts/update-prepa-data.mjs"
      - "scripts/update-usgs-reservoirs.mjs"
      - "scripts/update-official-data.mjs"
      - ".github/workflows/update-official-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2opr-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official AAA sources
        run: node scripts/update-official-data.mjs
      - name: Fetch USGS reservoir sensors operated with AAA
        run: node scripts/update-usgs-reservoirs.mjs
      - name: Fetch PREPA machine-readable feeds
        run: node scripts/update-prepa-data.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "h20pr-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh official H2O PR sources"
          git push
