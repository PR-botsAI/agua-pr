name: Refresh official H2O PR data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official sources
        run: node scripts/update-official-data.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/live.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "h20pr-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: refresh official sources"
          git push
