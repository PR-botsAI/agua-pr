name: Test PREPA live parser

on:
  push:
    branches: ["prepa-live-bridge"]
    paths:
      - "scripts/update-prepa-data.mjs"
      - "data/prepa.json"
      - ".github/workflows/test-prepa-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull and parse PREPA feeds
        run: node scripts/update-prepa-data.mjs
      - name: Validate parsed output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('data/prepa.json','utf8'));
          const live=[d.generation,d.levels,d.history].filter(x=>x?.status==='live').length;
          console.log('live feeds:',live);
          console.log('generation sites:',d.generation?.sites?.length||0);
          console.log('reservoir readings:',d.levels?.reservoirs?.length||0);
          console.log('history points:',d.history?.points?.length||0);
          if(live===0) process.exit(2);
          if(d.generation?.status==='live' && !(d.generation.sites?.length||d.generation.metrics?.length)) process.exit(3);
          if(d.levels?.status==='live' && !d.levels.reservoirs?.length) process.exit(4);
          if(d.history?.status==='live' && !d.history.points?.length) process.exit(5);
          NODE
